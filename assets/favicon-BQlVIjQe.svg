<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06101e"/>
      <stop offset="55%" stop-color="#091a26"/>
      <stop offset="100%" stop-color="#062925"/>
    </linearGradient>
    <linearGradient id="accent" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="steam" x1="30" y1="10" x2="30" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- Subtle Radar Ring -->
  <circle cx="32" cy="34" r="21" stroke="url(#accent)" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Aromatic Steam Waves -->
  <path d="M24 21C24 18 26.5 16.5 26.5 13.5" stroke="url(#steam)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M31 19.5C31 16 34 14.5 34 11" stroke="url(#steam)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38 21C38 18 40.5 16.5 40.5 13.5" stroke="url(#steam)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Chat Bubble + Coffee Cup Hybrid Body -->
  <g filter="url(#glow)">
    <path d="M17 26C17 24.8954 17.8954 24 19 24H41C42.1046 24 43 24.8954 43 26V35C43 42.1797 37.1797 48 30 48H27L20.5 52.5C19.6 53.1 18.4 52.4 18.6 51.3L19.4 46.2C17.88 43.98 17 41.28 17 38.3V26Z"
          fill="#071923" stroke="url(#accent)" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Cup Handle -->
    <path d="M43 28H46.5C49.5376 28 52 30.4624 52 33.5C52 36.5376 49.5376 39 46.5 39H42.2"
          stroke="url(#accent)" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Live Chat Dots Inside Cup -->
  <circle cx="25" cy="35.5" r="2.2" fill="#34d399"/>
  <circle cx="30.5" cy="35.5" r="2.2" fill="#2dd4bf"/>
  <circle cx="36" cy="35.5" r="2.2" fill="#22d3ee"/>

  <!-- Live Online Badge -->
  <circle cx="49" cy="15" r="4.5" fill="#10b981" stroke="#06101e" stroke-width="2"/>
</svg>
